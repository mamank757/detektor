<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJI TANAH & BWD - PPL Wajo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1412;
            --card-bg: rgba(45, 38, 34, 0.85);
            --accent-green: #2ecc71;
            --accent-neon: #00ff88;
            --text-color: #f5f5f5;
            --border-color: rgba(46, 204, 113, 0.4);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #121212; /* Dark Mode Solid */
            background-image: radial-gradient(circle at 50% 50%, #2d2622 0%, #121212 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .mode-selector {
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: #aaa;
            background: transparent;
            font-weight: 600;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: var(--accent-green);
            color: #fff;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }

        .upload-area {
            border: 2px dashed var(--accent-green);
            padding: 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #preview { max-width: 100%; border-radius: 15px; display: none; border: 2px solid var(--accent-green); }

        .scanner-line {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent-neon);
            box-shadow: 0 0 20px var(--accent-neon);
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        button#btnDetect {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            padding: 18px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        button#btnDetect:disabled { background: #555; cursor: not-allowed; }

        #result {
            margin-top: 1.5rem;
            padding: 1.2rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            border-left: 5px solid var(--accent-green);
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--accent-green); font-size: 1.5rem; margin-bottom: 5px;">PENYULUH MILENIAL</h1>
    <p style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 20px;">Kecamatan Bola, Kabupaten Wajo</p>

    <div class="mode-selector">
        <button id="btnSoil" class="mode-btn active" onclick="switchMode('soil')">Cek Tanah</button>
        <button id="btnLeaf" class="mode-btn" onclick="switchMode('leaf')">Cek BWD</button>
    </div>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="scanner-line" id="scanner"></div>
        <img id="preview">
        <p id="msg">📸 Ambil Foto Sampel</p>
        <input type="file" id="fileInput" accept="image/*" hidden onchange="previewImage(event)">
    </div>

    <button id="btnDetect" onclick="analyze()">Analisis AI Sekarang</button>

    <div id="result">
        <h3 id="resLabel" style="color: var(--accent-neon); margin: 0; text-transform: uppercase;">Hasil Analisis</h3>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 10px 0;">
        <div id="resBody" style="font-size: 0.9rem; line-height: 1.6;"></div>
    </div>
</div>

<script>
    let currentMode = 'soil';
    // Ganti URL ini dengan URL Web App Apps Script Bapak yang sudah mendukung Roboflow API
    const scriptURL = "https://script.google.com/macros/s/AKfycbzFM1oIuTT9dcqHTLZhHt2nsL8FRv9qvICZjCemBCiZUXRvJItrnIv4kQ2tymdtWKtqUw/exec";

    const kamusTanah = {
        "Loamy": { "nama": "Lempung", "saran": "Sangat subur, cocok untuk padi & jagung." },
        "Clay": { "nama": "Tanah Liat", "saran": "Drainase harus diperhatikan agar akar tidak busuk." },
        "Sandy": { "nama": "Tanah Berpasir", "saran": "Butuh banyak kompos dan pengairan rutin." }
    };

    // Sesuaikan key dengan label yang Bapak buat di Roboflow (misal: kelas1, kelas2)
    const kamusDaun = {
        "kelas1": { "nama": "Skala 1", "status": "Sangat Kurang N", "saran": "Segera beri pupuk Urea dosis tinggi (100-125 kg/ha)." },
        "kelas2": { "nama": "Skala 2", "status": "Kurang N", "saran": "Beri pupuk Urea dosis sedang (75 kg/ha)." },
        "kelas3": { "nama": "Skala 3", "status": "Cukup", "saran": "Pantau seminggu lagi, pemupukan tunda dulu." },
        "kelas4": { "nama": "Skala 4", "status": "Optimal", "saran": "Kondisi sangat baik, tidak perlu pupuk N." },
        "kelas5": { "nama": "Skala 5", "status": "Berlebih", "saran": "Hentikan pupuk N, waspada serangan hama wereng." }
    };

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('btnSoil').classList.toggle('active', mode === 'soil');
        document.getElementById('btnLeaf').classList.toggle('active', mode === 'leaf');
        document.getElementById('msg').innerText = mode === 'soil' ? '📸 Foto Sampel Tanah' : '📸 Foto Daun Padi (BWD)';
        document.getElementById('result').style.display = 'none';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('msg').style.display = 'block';
    }

    function previewImage(event) {
        const reader = new FileReader();
        const output = document.getElementById('preview');
        reader.onload = () => { 
            output.src = reader.result; 
            output.style.display = 'block';
            document.getElementById('msg').style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    async function analyze() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Silakan ambil foto terlebih dahulu!");

        const btn = document.getElementById('btnDetect');
        const scanner = document.getElementById('scanner');
        
        btn.disabled = true;
        btn.innerText = "Sedang Menganalisis...";
        scanner.style.display = 'block';

        const reader = new FileReader();
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        image: base64, 
                        mode: currentMode 
                    })
                });
                const data = await response.json();
                displayResult(data);
            } catch (e) {
                alert("Koneksi gagal! Pastikan Apps Script sudah di-deploy sebagai Web App.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Analisis AI Sekarang";
                scanner.style.display = 'none';
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

   function displayResult(data) {
    const resultDiv = document.getElementById('result');
    const resLabel = document.getElementById('resLabel');
    const resBody = document.getElementById('resBody');
    
    resultDiv.style.display = 'block';
    
    // CEK APAKAH ADA ERROR DARI APPS SCRIPT
    if (data.error) {
        resLabel.innerText = "TIDAK TERDETEKSI";
        resBody.innerHTML = `<p style="color: #ff4444;">${data.error}</p>`;
        return;
    }

    // Pastikan angka confidence ada, jika tidak beri angka 0
    const akurasi = data.confidence ? Math.round(data.confidence) : 0;
    
    if (currentMode === 'soil') {
        const info = kamusTanah[data.label] || { "nama": data.label, "saran": "Data belum tersedia." };
        resLabel.innerText = "HASIL: " + info.nama;
        resBody.innerHTML = `<b>Akurasi:</b> ${akurasi}% <br> <b>Saran:</b> ${info.saran}`;
    } else {
        const info = kamusDaun[data.label] || { "nama": data.label, "status": "Tidak Diketahui", "saran": "Pastikan foto daun jelas." };
        resLabel.innerText = "BWD: " + (info.nama || "TIDAK DIKENAL");
        resBody.innerHTML = `<b>Status:</b> ${info.status} <br> <b>Akurasi:</b> ${akurasi}% <br> <b>Tindakan:</b> ${info.saran}`;
    }
}
</script>
</body>
</html>
