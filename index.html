<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Padi Milenial - BPP Bola</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; text-align: center; padding: 20px; color: white; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 2px solid #238636; }
        .btn { background: #238636; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-camera { background: #1f6feb; }
        #result { text-align: left; background: #161b22; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 13px; display: none; border: 1px solid #30363d; }
        .loading { display: none; margin-top: 10px; color: #8b949e; }
    </style>
</head>
<body>

<div class="card">
    <h3>Deteksi Daun Padi</h3>
    <p style="color: #8b949e;">BPP Kecamatan Bola</p>
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
    
    <button class="btn btn-camera" onclick="document.getElementById('fileInput').click()">📸 Ambil Foto / Kamera</button>
    
    <img id="preview" src="" alt="Preview Gambar">
    
    <button id="uploadBtn" class="btn" style="display: none;" onclick="prosesUpload()">🚀 Analisis Sekarang</button>
    
    <div id="loading" class="loading">⏳ Sedang Menganalisis...</div>
    <div id="result"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const uploadBtn = document.getElementById('uploadBtn');
    const resultDiv = document.getElementById('result');
    const loading = document.getElementById('loading');

    let base64String = "";

    // Ganti dengan URL Web App Google Apps Script Anda
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNxaXj7CMdRj_JuSrBwlnVNh7hksKQVgJPmaUT8vcALXoPjk8isQofvk0NXpk2krxf/exec";

    // Kamus Penyakit & Solusi
   const kamusTani = {
    "Brown Spot": {
        nama: "Bercak Cokelat (Brown Spot)",
        gejalaDampak: "Muncul bintik kecil oval berwarna coklat tua dengan pusat abu-abu/putih dan tepian kuning (halo). Infeksi berat menyebabkan daun menguning, layu, dan gabah menjadi kopong.",
        penyebab: "Jamur Bipolaris oryzae. Menyebar melalui angin dan percikan air. Risiko tinggi pada tanah masam atau kurang nutrisi (Silikon).",
        pengendalian: "Gunakan benih bersertifikat, pemupukan seimbang (tambah Kalium & Silikon), dan fungisida berbahan aktif Difenokonazol atau Propikonazol."
    },
    "Blast": {
        nama: "Penyakit Blast (Patah Leher)",
        gejalaDampak: "Bercak berbentuk belah ketupat pada daun. Jika menyerang leher malai, malai akan patah dan gabah menjadi hampa/busuk.",
        penyebab: "Jamur Pyricularia oryzae. Menyebar cepat pada suhu malam yang dingin dan kelembaban tinggi.",
        pengendalian: "Kurangi pupuk Urea berlebih, gunakan varietas tahan, dan semprot fungisida sistemik berbahan aktif Trisiklazol."
    },
    "Nitrogen deficiency": {
        nama: "Kekurangan Nitrogen (Kurang Urea)",
        gejalaDampak: "Seluruh permukaan daun menguning seragam mulai dari daun yang paling tua/bawah, pertumbuhan tanaman terhambat.",
        penyebab: "Kadar Nitrogen tanah rendah atau dosis pupuk tidak mencukupi kebutuhan fase pertumbuhan.",
        pengendalian: "Tambahkan pupuk Urea sesuai rekomendasi E-RDKK atau bagan warna daun (BWD). Gunakan pupuk organik untuk menjaga kesuburan tanah."
    },
    "Phosphorus deficiency": {
        nama: "Kekurangan Fosfor (Kurang SP-36)",
        gejalaDampak: "Tanaman kerdil, jumlah anakan sedikit, daun tegak sempit dengan warna hijau gelap atau muncul warna ungu di ujung daun.",
        penyesan: "Ketersediaan P rendah dalam tanah, sering terjadi pada tanah sawah yang terus menerus digenangi tanpa pengeringan.",
        pengendalian: "Pemberian pupuk SP-36 atau TSP secara tepat. Lakukan pengeringan tanah secara berkala agar akar bisa menyerap P dengan baik."
    },
    "Potassium deficiency": {
        nama: "Kekurangan Kalium (Kurang KCL)",
        gejalaDampak: "Pinggiran daun menguning lalu menjadi cokelat seperti terbakar. Batang menjadi lemah dan tanaman mudah rebah atau terserang penyakit.",
        penyebab: "Kurangnya asupan KCL atau tanah memiliki kemampuan ikat K yang rendah.",
        pengendalian: "Gunakan pupuk KCL atau ZK. Kembalikan jerami ke sawah karena jerami mengandung banyak unsur Kalium."
    },
    "Tungro": {
        nama: "Penyakit Tungro (Kerdil Kuning)",
        gejalaDampak: "Tanaman menjadi sangat kerdil, daun berubah warna menjadi kuning oranye mulai dari pucuk ke pangkal daun tua.",
        penyebab: "Virus yang ditularkan oleh hama Wereng Hijau (Nephotettix virescens).",
        pengendalian: "Tanam serempak, cabut dan musnahkan tanaman yang sakit (eradikasi), dan kendalikan wereng hijau sejak dini."
    }
};

    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    base64String = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    preview.src = canvas.toDataURL('image/jpeg');
                    preview.style.display = 'block';
                    uploadBtn.style.display = 'block';
                    resultDiv.style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        }
    };

    async function prosesUpload() {
        loading.style.display = 'block';
        uploadBtn.disabled = true;
        resultDiv.style.display = 'none';

        try {
            const resp = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ image: base64String })
            });
            const data = await resp.json();
            
            loading.style.display = 'none';
            uploadBtn.disabled = false;
            resultDiv.style.display = 'block';

            // Ambil data prediksi pertama
            const predictions = data.outputs[0].predictions.predictions;
            if (predictions && predictions.length > 0) {
                const prediksi = predictions[0];
                const labelAI = prediksi.class;
                const infoTani = kamusTani[labelAI] || { nama: labelAI, gejala: "-", solusi: "Hubungi petugas PPL terdekat." };

               resultDiv.innerHTML = `
    <div style="text-align: left; padding: 10px; border-radius: 10px;">
        <h2 style="color: #FFD700; border-bottom: 2px solid #2ea043; padding-bottom: 5px;">📍 ${infoTani.nama}</h2>
        <p style="margin: 10px 0;"><strong>Tingkat Keyakinan AI:</strong> ${(prediksi.confidence * 100).toFixed(0)}%</p>
        
        <div style="margin-bottom: 15px;">
            <h4 style="color: #FFA500; margin-bottom: 5px;">🔍 Gejala dan Dampak</h4>
            <p style="font-size: 0.95em; line-height: 1.5; color: #d1d5da;">${infoTani.gejalaDampak}</p>
        </div>

        <div style="margin-bottom: 15px;">
            <h4 style="color: #f85149; margin-bottom: 5px;">🧬 Penyebab dan Penyebaran</h4>
            <p style="font-size: 0.95em; line-height: 1.5; color: #d1d5da;">${infoTani.penyebab}</p>
        </div>

        <div style="background: #1c2128; padding: 12px; border-radius: 8px; border-left: 5px solid #2ea043;">
            <h4 style="color: #2ea043; margin-bottom: 5px;">✅ Pengendalian dan Pencegahan</h4>
            <p style="font-size: 0.95em; line-height: 1.5; color: #e6edf3;">${infoTani.pengendalian}</p>
        </div>

        <h4 style="margin-top: 20px; color: #8b949e;">🖼️ Analisis Foto:</h4>
        <img src="data:image/jpeg;base64,${data.outputs[0].annotated_image.value}" 
             style="width:100%; border-radius:10px; border: 1px solid #30363d; margin-top: 5px;">
    </div>
`;
            } else {
                resultDiv.innerHTML = "<p>Daun tampak sehat atau objek tidak dikenali.</p>";
                resultDiv.style.display = 'block';
            }

        } catch (err) {
            loading.style.display = 'none';
            uploadBtn.disabled = false;
            alert("Gagal menganalisis gambar. Pastikan internet stabil.");
            console.error(err);
        }
    }
</script>

</body>
</html>
