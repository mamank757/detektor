<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONSULTASI TANI DIGITAL - PPL Wajo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1412;
            --card-bg: rgba(45, 38, 34, 0.7);
            --accent-green: #2ecc71;
            --accent-brown: #cd853f;
            --text-color: #f5f5f5;
            --border-color: rgba(46, 204, 113, 0.3);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #2d2622 0%, #1a1412 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .mode-selector {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 5px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: #fff;
            background: transparent;
            font-weight: 600;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            padding: 2rem;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        #preview { max-width: 100%; border-radius: 15px; display: none; margin: 0 auto; }

        .scanner-line {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent-green);
            box-shadow: 0 0 20px var(--accent-green);
            animation: scan 2.5s linear infinite;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        button#btnDetect {
            background: linear-gradient(135deg, #a0522d, #cd853f);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(160, 82, 45, 0.4);
            transition: 0.4s;
        }

        button#btnDetect:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(205, 133, 63, 0.6); }

        #result {
            margin-top: 1.5rem;
            padding: 1.2rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--accent-green); font-size: 1.4rem; margin-bottom: 5px;">KONSULTASI TANI AI</h1>
    <p style="font-size: 0.7rem; opacity: 0.7; margin-bottom: 20px;">Digitalisasi BPP Bola - Wajo</p>

    <div class="mode-selector">
        <button id="btnSoil" class="mode-btn active" onclick="switchMode('soil')">Tekstur Tanah</button>
        <button id="btnLeaf" class="mode-btn" onclick="switchMode('leaf')">Warna Daun (BWD)</button>
    </div>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="scanner-line" id="scanner"></div>
        <p id="msg">Ketuk untuk Ambil Foto</p>
        <input type="file" id="fileInput" accept="image/*" hidden onchange="previewImage(event)">
        <img id="preview">
    </div>

    <button id="btnDetect" onclick="analyze()">Mulai Analisis AI</button>

    <div id="result">
        <h2 id="resLabel" style="color: var(--accent-green); margin: 0;">---</h2>
        <div id="resBody" style="font-size: 0.85rem; text-align: left; margin-top: 10px; color: #fff;"></div>
        <div id="vizContainer" style="margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 15px;">
            <canvas id="textureTriangle" width="300" height="250" style="max-width: 100%;"></canvas>
            <p style="font-size: 0.6rem; opacity: 0.5; margin-top: 5px;">Visualisasi Tekstur USDA</p>
        </div>
    </div>
</div>

<script>
    let currentMode = 'soil';
    const scriptURL = "https://script.google.com/macros/s/AKfycbwKAFBGVwG4481rgGZetkFvYryyjkChzoy9ZKYmcSZm4Zzpr3YbyR0bryDgLV16O4hubw/exec";

     const kamusTanah = {
    "Alluvial": { "nama": "Tanah Alluvial", "pH": "6.0 - 7.0", "organik": "Sedang", "npk": "Tinggi", "subur": "Sangat Subur", "tanaman": "Padi, Palawija, Tebu", "saran": "Ideal untuk Padi. Jaga sirkulasi air." },
    "Black": { "nama": "Tanah Hitam", "pH": "6.5 - 7.5", "organik": "Tinggi", "npk": "Tinggi", "subur": "Subur", "tanaman": "Kapas, Kedelai, Jagung", "saran": "Bagus untuk Kedelai. Olah saat lembap." },
    "Cinder": { "nama": "Tanah Vulkanik", "pH": "5.0 - 7.0", "organik": "Tinggi", "npk": "Sangat Tinggi", "subit": "Sangat Subur", "tanaman": "Sayuran, Kopi, Buah-buahan", "saran": "Terbaik untuk Sayuran/Horti." },
    "Clay": { "nama": "Tanah Liat", "pH": "4.5 - 6.0", "organik": "Sedang", "npk": "Sedang", "subur": "Sedang", "tanaman": "Padi, Rumput Gajah", "saran": "Drainase wajib lancar agar tak busuk." },
    "Laterite": { "nama": "Tanah Laterit", "pH": "4.0 - 5.5", "organik": "Rendah", "npk": "Rendah", "subur": "Kurang", "tanaman": "Kelapa Sawit, Karet", "saran": "Tambah pupuk organik & kapur." },
    "Loamy": { "nama": "Tanah Lempung", "pH": "6.0 - 7.0", "organik": "Tinggi", "npk": "Tinggi", "subur": "Sangat Subur", "tanaman": "Hampir Semua Jenis Tanaman", "saran": "Tanah prima untuk semua tanaman." },
    "loam": { "nama": "Tanah Lempung", "pH": "6.0 - 7.0", "organik": "Tinggi", "npk": "Tinggi", "subur": "Sangat Subur", "tanaman": "Hampir Semua Jenis Tanaman", "saran": "Tanah prima untuk semua tanaman." },
    "Peat": { "nama": "Tanah Gambut", "pH": "3.0 - 5.0", "organik": "Sangat Tinggi", "npk": "Rendah", "subur": "Rendah", "tanaman": "Nanas, Kelapa Sawit", "saran": "Beri Dolomit & parit drainase." },
    "Red": { "nama": "Tanah Merah", "pH": "4.5 - 5.5", "organik": "Rendah", "npk": "Rendah", "subur": "Kurang", "tanaman": "Ubi Kayu, Karet", "saran": "Beri SP-36 dosis ekstra." },
    "Sandy": { "nama": "Tanah Berpasir", "pH": "5.5 - 7.0", "organik": "Rendah", "npk": "Rendah", "subur": "Rendah", "tanaman": "Kelapa, Semangka, Kacang Tanah", "saran": "Wajib tambah kompos tiap musim." },
    "Yellow": { "nama": "Tanah Kuning", "pH": "4.5 - 5.5", "organik": "Rendah", "npk": "Rendah", "subur": "Kurang", "tanaman": "Tanaman Keras/Kehutanan", "saran": "Pakai mulsa agar tak tererosi." }
};

    const kamusDaun = {
        "Skala 2": { "status": "Kurang N", "saran": "Pupuk Urea 75-100 kg/ha segera." },
        "Skala 3": { "status": "Waspada", "saran": "Berikan pupuk Urea dosis sedang." },
        "Skala 4": { "status": "Optimal", "saran": "Kondisi baik, tunda pemupukan." },
        "Skala 5": { "status": "Berlebih", "saran": "Hentikan pemupukan sementara." }
    };

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('btnSoil').classList.toggle('active', mode === 'soil');
        document.getElementById('btnLeaf').classList.toggle('active', mode === 'leaf');
        document.getElementById('msg').innerText = mode === 'soil' ? 'Foto Sampel Tanah' : 'Foto Daun Padi (BWD)';
        document.getElementById('vizContainer').style.display = mode === 'soil' ? 'block' : 'none';
        document.getElementById('result').style.display = 'none';
    }

    function previewImage(event) {
        const reader = new FileReader();
        const output = document.getElementById('preview');
        reader.onload = () => { 
            output.src = reader.result; 
            output.style.display = 'block';
            document.getElementById('msg').style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

   function drawTriangle(label) {
        const canvas = document.getElementById('textureTriangle');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(150, 35); ctx.lineTo(35, 225); ctx.lineTo(265, 225);
        ctx.closePath(); ctx.stroke();

        let dot = { x: 150, y: 130 }; // Default tengah
        const labelLower = label.toLowerCase();
        
        // Mapping koordinat berdasarkan jenis tanah
        if (labelLower.includes("clay") || labelLower.includes("liat")) dot = { x: 150, y: 80 };
        else if (labelLower.includes("sand") || labelLower.includes("pasir")) dot = { x: 90, y: 200 };
        else if (labelLower.includes("loam") || labelLower.includes("lempung")) dot = { x: 150, y: 180 };
        else if (labelLower.includes("alluvial")) dot = { x: 180, y: 190 };
        else if (labelLower.includes("peat") || labelLower.includes("gambut")) dot = { x: 150, y: 130 };

        ctx.fillStyle = '#e74c3c';
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#e74c3c";
        ctx.beginPath(); ctx.arc(dot.x, dot.y, 7, 0, Math.PI * 2); ctx.fill();
    }
    async function analyze() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Pilih foto dulu, Raja!");

        document.getElementById('scanner').style.display = 'block';
        document.getElementById('btnDetect').disabled = true;

        const reader = new FileReader();
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            try {
                const resp = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ image: base64, mode: currentMode })
                });
                const data = await resp.json();
                
                document.getElementById('result').style.display = 'block';
                
                if (currentMode === 'soil') {
                    const info = kamusTanah[data.label] || { "nama": data.label, "pH": "-", "saran": data.saran };
                    document.getElementById('resLabel').innerText = info.nama;
                    document.getElementById('resBody').innerHTML = `
                        <p><b>Akurasi:</b> ${data.confidence}%</p>
                        <p><b>Estimasi pH:</b> ${info.pH}</p>
                        <p style="border-top: 1px solid #444; padding-top: 10px;"><b>Saran PPL:</b><br>${info.saran}</p>
                    `;
                    drawTriangle(data.label);
                } else {
                    const info = kamusDaun[data.label] || { "status": "Tidak Terdeteksi", "saran": data.saran };
                    document.getElementById('resLabel').innerText = data.label;
                    document.getElementById('resBody').innerHTML = `
                        <p><b>Akurasi:</b> ${data.confidence}%</p>
                        <p><b>Status Nitrogen:</b> ${info.status}</p>
                        <p style="border-top: 1px solid #444; padding-top: 10px;"><b>Saran PPL:</b><br>${info.saran}</p>
                    `;
                }
            } catch (e) { 
                alert("Gagal koneksi ke server AI!"); 
            } finally { 
                document.getElementById('scanner').style.display = 'none'; 
                document.getElementById('btnDetect').disabled = false;
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>
</body>
</html>
